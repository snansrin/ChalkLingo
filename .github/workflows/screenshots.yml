name: Capture Mochi screenshots
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run test:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: Mochi-Screenshots
          path: docs/screenshots/mochi-*.png
