name: Refresh widget screenshots
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/screenshots.yml'
      - 'tests/screenshots.cjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chalklingo-screenshots-main
  cancel-in-progress: false
jobs:
  windows-real-screenshots:
    name: Capture four real Electron views and commit PNGs
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify application
        run: npm run check
      - name: Capture the actual visible Windows widget
        run: npm run test:screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: ChalkLingo-v031-screenshots
          path: docs/screenshots/widget-*.png
          if-no-files-found: error
      - name: Publish screenshots to main
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/widget-compact.png docs/screenshots/widget-settings.png docs/screenshots/widget-voice.png docs/screenshots/widget-practice.png
          $changed = git diff --cached --name-only
          if (-not $changed) {
            Write-Host "Screenshots already match repository"
            exit 0
          }
          git commit -m "docs: capture real v0.3.1 Windows widget screenshots [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
