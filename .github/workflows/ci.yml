name: Verify and package Mochi
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
  windows:
    runs-on: windows-latest
    needs: quality
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:desktop
      - run: npm run test:studio
      - run: npm run test:education
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Mochi-Windows
          path: |
            release/Mochi*.exe
            docs/screenshots/mochi-*.png
          if-no-files-found: error
